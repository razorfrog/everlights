<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111014">
<meta name="robots" content="noindex">
<title>Sign in · Everlights</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<style>
:root { --bg: #111014; --panel: #1b1a20; --line: #2f2e37; --text: #f2efe9; --muted: #9b97a3; --accent: #ffb547; --err: #ff6b6b; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 20px; }
h1 { font-size: 22px; margin: 0 0 4px; }
p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
input { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
button { width: 100%; margin-top: 14px; font: inherit; font-weight: 600; background: var(--accent); color: #1d1406; border: 0; border-radius: 10px; padding: 11px; cursor: pointer; }
.err { color: var(--err); font-size: 14px; min-height: 1.3em; margin-top: 10px; }
a { color: var(--muted); font-size: 14px; display: block; text-align: center; margin-top: 16px; }
</style>
</head>
<body>
<form method="post" action="/admin/login">
  <h1>Everlights</h1>
  <p>Sign in to control the lights.</p>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Sign in</button>
  <div class="err">__ERROR__</div>
  <a href="/">See what's showing now</a>
</form>
</body>
</html>
